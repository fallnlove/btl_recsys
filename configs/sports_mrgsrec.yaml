defaults:
  - dataloader

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model_name}__${dataset.name}__${now:%H-%M-%S}

dataset:
  path_to_data_dir: data
  name: reviews_Sports_and_Outdoors_5_098_096
  max_sequence_length: 10

model:
  # optuna params
  embedding_dim: 16
  num_heads: 2
  num_layers: 1
  dim_feedforward: 32
  dropout: 0.5
  num_hops: 1
  eta: 0.7066136821518646
  # other params
  activation: gelu
  layer_norm_eps: 1.0e-09
  initializer_range: 0.02

optimizer:
  optimizer:
    type: adam
    lr: 0.0003323286698794
  clip_grad_threshold: 10.0

device: "cuda"
num_epochs: 100
early_stopping_rounds: 20

loss:
  local:
    predictions_prefix: local_prediction
    labels_prefix: positive
  global:
    positive_prefix: global_positive
    negative_prefix: global_negative
  fusion:
    positive_prefix: fusion_positive
    negative_prefix: fusion_negative
  contrastive:
    fst_embeddings_prefix: contrastive_fst_embeddings
    snd_embeddings_prefix: contrastive_snd_embeddings
  local_coef: 0.6879986520738628
  global_coef: 0.96641100196657
  fusion_coef: 0.1903733825511383
  contrastive_coef: 0.1023015231887275
model_name: mrgsrec