- name: batch_size
  type: categorical
  choices:
    - 128
    - 256
    - 512

- name: bucket_size_y
  type: categorical
  choices:
    - 16
    - 32
    - 64
    - 128
    - 256

- name: filter_seen
  type: categorical
  choices:
    - true
    - false