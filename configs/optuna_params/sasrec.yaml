- name: lr
  type: categorical
  choices:
    - 0.005
    - 0.001
    - 0.0005

- name: hidden_size
  type: categorical
  choices:
    - 32
    - 64
    - 128

- name: num_heads
  type: categorical
  choices:
    - 1
    - 2

- name: dropout
  type: categorical
  choices:
