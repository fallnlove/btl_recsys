- name: rank
  type: categorical
  choices: [16, 32, 64, 128, 256]

- name: learning_rate
  type: categorical
  choices: [1e-4, 5e-4, 1e-3, 5e-3, 1e-2]

- name: regularization
  type: categorical
  choices: [0.0, 1e-6, 1e-5, 5e-5, 1e-4, 1e-3]

- name: n_layers
  type: int
  low: 1
  high: 4
  step: 1

- name: edge_dropout
  type: float
  low: 0.0
  high: 0.5
  step: 0.1

- name: foldin_epochs
  type: int
  low: 1
  high: 8
  step: 1

- name: foldin_lr
  type: categorical
  choices: [1e-4, 1e-3, 1e-2]

- name: foldin_reg
  type: categorical
  choices: [0.0, 1e-6, 1e-5, 1e-4]

