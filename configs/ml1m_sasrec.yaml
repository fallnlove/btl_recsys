defaults:
  - dataloader
  - loss

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model_name}__${dataset.name}__${now:%H-%M-%S}

dataset:
  path_to_data_dir: data
  name: ml1m_098_096
  max_sequence_length: 10

model:
  embedding_dim: 64
  num_heads: 4
  num_layers: 4
  dim_feedforward: 128
  dropout: 0.1
  activation: gelu
  layer_norm_eps: 1.0e-09

optimizer:
  optimizer:
    type: adam
    lr: 0.0028403070522863

device: "cuda"
num_epochs: 100
early_stopping_rounds: 20
model_name: mrgsrec